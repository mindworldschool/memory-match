  <meta charset="utf-8">
  <meta name="robots" content="noindex">

  <!-- Viewport для мобильных с вырезами экрана -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- SEO & Open Graph for Memory Match -->
  <meta name="description" content="Memory Match — онлайн-гра для розвитку пам’яті та уваги. Доступна на сайті MindWorld School. Грайте безкоштовно в режимах картинка-картинка, слово-слово та картинка-слово.">

  <!-- Open Graph (Facebook, Telegram, LinkedIn) -->
  <meta property="og:title" content="Memory Match — онлайн-гра для тренування пам’яті">
  <meta property="og:description" content="Безкоштовна гра для розвитку пам’яті. Виберіть режим: картинка–картинка, слово–слово або картинка–слово.">
  <meta property="og:image" content="https://mindworldschool.com/assets/memory-match-og.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mindworldschool.com/memory-match">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Memory Match — тренажер пам’яті онлайн">
  <meta name="twitter:description" content="Онлайн-гра для дітей і дорослих. Тренуйте пам’ять із картками слів і картинок.">
  <meta name="twitter:image" content="https://mindworldschool.com/assets/memory-match-og.jpg">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff7c00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <title>Memory Match — MindWorld School</title>
  <!-- Общая оболочка публичных тренажёров: шапка, языки, шрифты, цвета -->
  <link rel="stylesheet" href="/trainer-shell/shell.v1.css">
  <link rel="stylesheet" href="styles.css?v=3">
  <script src="/trainer-shell/shell.v1.js"></script>
</head>
<body>
  <!-- Сюда оболочка вставит шапку (лого, название, UA / EN / RU / ES) -->
  <div id="mw-header"></div>

  <main class="container">
    <!-- Start Screen -->
    <section id="screen-start" class="card">
      <div class="start-panel">
        <h2 class="section-title">Налаштування гри</h2>
        <div class="controls-row">
          <div class="group">
            <label for="mode">Тип пар:</label>
            <select id="mode">
              <option value="img-img">Зображення–Зображення</option>
              <option value="word-word">Слово–Слово</option>
              <option value="img-word">Зображення–Слово</option>
            </select>
          </div>
          <div class="group">
            <label for="pairCount">Кількість пар:</label>
            <input id="pairCount" type="number" value="6" min="2" step="1">
          </div>
        </div>
        <div class="controls-row">
          <div class="group">
            <label for="timeMode">Режим:</label>
            <select id="timeMode">
              <option value="no-time">Без часу</option>
              <option value="with-time">Час раунду</option>
            </select>
          </div>
          <div class="group" id="timeGroup" style="display:none">
            <label for="roundSeconds">Секунди:</label>
            <input id="roundSeconds" type="number" value="60" min="10" step="5">
          </div>
        </div>
        <div class="controls-row">
          <button id="btnStart" onclick="startGame()">Почати гру</button>
        </div>
      </div>
    </section>

    <!-- Memory Drum Screen -->
    <section id="screen-memory" class="card hidden">
      <div class="flex-col">
        <div class="topbar">
          <button id="btnExitMemory" class="exit">Вихід</button>
          <div><span class="badge">Екран запам’ятовування</span> <span id="memoryMeta" class="meta">Пара 1/1</span></div>
          <button id="btnMemoryDone" class="secondary">Запам’ятав усе — почати гру</button>
        </div>

        <div class="memory-stage">
          <div class="pair-view">
            <div class="frame" id="memoryLeft"></div>
            <div class="frame" id="memoryRight"></div>
          </div>
          <div class="nav-vertical">
            <button id="btnMemPrev" aria-label="Previous pair">▲</button>
            <button id="btnMemNext" aria-label="Next pair">▼</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Play Screen -->
    <section id="screen-play" class="card hidden">
      <div class="flex-col">
        <div class="topbar">
          <button id="btnExitPlay" class="exit">Вихід</button>
          <div id="playMetaLeft"><span class="badge" id="playBadge">Гра</span> <span id="playMeta" class="meta">Пара 1/1 • Режим: —</span></div>
          <div id="timerBox" class="badge hidden">00:00</div>
        </div>

        <div class="play-stage">
          <div class="pair-view">
            <div class="frame" id="playLeft"></div>
            <div class="frame drop-target" id="playRight"></div>
          </div>
          <div class="nav-vertical">
            <button id="btnPlayPrev" aria-label="Previous pair">▲</button>
            <button id="btnPlayNext" aria-label="Next pair">▼</button>
          </div>
        </div>

        <h3 class="section-title" id="answerOptionsTitle">Варіанти відповіді</h3>
        <div id="optionsTray" class="bottom-tray"></div>
      </div>
    </section>

    <!-- Results Screen -->
    <section id="screen-results" class="card hidden">
      <div class="results">
        <h2>Результати</h2>
        <div class="stats">
          <div class="stat">Правильно: <span id="statCorrect">0</span></div>
          <div class="stat">Помилки: <span id="statWrong">0</span></div>
        </div>
        <div class="controls-row">
          <button id="btnRepeat">Повторити раунд</button>
          <button id="btnNew" class="secondary">Нова гра</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Exit confirmation modal -->
  <div id="exitModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3>Завершити гру?</h3>
      <p class="meta">Поточний процес не збережеться.</p>
      <div class="controls-row">
        <button id="exitYes">Так, вийти</button>
        <button id="exitNo" class="secondary">Скасувати</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>

  <!-- Регистрация Service Worker для PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
      });
    }
  </script>
</body>
</html>
